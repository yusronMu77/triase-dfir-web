# CI web: typecheck, biome, tes unit dan arsitektur, build, gitleaks. Repo ui ikut di-checkout ke ../ui (alias @astria/ui).
# Action dan alat dipin dengan SHA, digest, atau versi tepat (pelajaran insiden Trivy); tidak ada tag mutabel.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: web
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yusronMu77/triase-dfir-ui
          token: ${{ secrets.DEPS_TOKEN || secrets.BOARD_TOKEN }}
          path: ui
          persist-credentials: false
      - name: Pasang bun (versi tepat, lewat npm)
        run: npm install --global bun@${{ env.BUN_VERSION }} && bun --version
      - name: Pasang dependensi ui
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: Pasang dependensi web
        working-directory: web
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: web
        run: bun run typecheck
      - name: biome
        working-directory: web
        run: bun run check
      - name: tes unit
        working-directory: web
        run: bun run test:unit
      - name: tes arsitektur
        working-directory: web
        run: bun run test:arch
      - name: build
        working-directory: web
        run: bun run build
      - name: gitleaks
        run: docker run --rm -v "$PWD/web:/repo" -w /repo "$GITLEAKS_IMAGE" git --redact --no-banner /repo
